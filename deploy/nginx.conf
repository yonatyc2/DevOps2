# ── HTTP → HTTPS redirect ────────────────────────────────────────────────────
server {
    listen 80;
    server_name devops-assistant.equals.co.zw;
    return 301 https://$host$request_uri;
}

# ── HTTPS — main site ────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name devops-assistant.equals.co.zw;

    ssl_certificate     /etc/ssl/equals/star.equals.co.zw.crt;
    ssl_certificate_key /etc/ssl/equals/star.equals.co.zw.key;

    root /var/www/devops-assistant;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript;
    gzip_min_length 1024;

    # ── Node.js API (port 3001) ──────────────────────────────────────────────
    location /api/logs/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    location /api/certs/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_read_timeout 30s;
    }

    location /api/registry/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_read_timeout 30s;
    }

    location /api/health {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    location /api/history/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_read_timeout 30s;
    }

    location /api/tasks/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_read_timeout 30s;
    }

    location /api/jobs/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_read_timeout 120s;
    }

    # ── Spring Boot API (port 8080) — AI Assistant ───────────────────────────
    # Comment out if Spring Boot is not running.
    location /api/ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    # ── React SPA ────────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}

# ── IP fallback (plain HTTP) ─────────────────────────────────────────────────
server {
    listen 80 default_server;
    server_name 192.168.150.190 _;
    root /var/www/devops-assistant;
    index index.html;

    location /api/logs/     { proxy_pass http://127.0.0.1:3001; proxy_http_version 1.1; proxy_set_header Host $host; }
    location /api/certs/    { proxy_pass http://127.0.0.1:3001; proxy_http_version 1.1; proxy_set_header Host $host; }
    location /api/registry/ { proxy_pass http://127.0.0.1:3001; proxy_http_version 1.1; proxy_set_header Host $host; }
    location /api/health    { proxy_pass http://127.0.0.1:3001; proxy_http_version 1.1; proxy_set_header Host $host; }
    location /api/history/  { proxy_pass http://127.0.0.1:3001; proxy_http_version 1.1; proxy_set_header Host $host; proxy_read_timeout 30s; }
    location /api/tasks/    { proxy_pass http://127.0.0.1:3001; proxy_http_version 1.1; proxy_set_header Host $host; proxy_read_timeout 30s; }
    location /api/jobs/     { proxy_pass http://127.0.0.1:3001; proxy_http_version 1.1; proxy_set_header Host $host; proxy_read_timeout 120s; }
    location / { try_files $uri $uri/ /index.html; }
}
